<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIOTECHCENTRE</title>
    <meta name="description" content="A comprehensive management system built with React, TypeScript, and Supabase. It includes modules for inventory, customer, purchase, and invoice management, along with reporting and analytics." />
    <meta property="og:title" content="BIOTECHCENTRE" />
    <meta property="og:description" content="A comprehensive management system built with React, TypeScript, and Supabase. It includes modules for inventory, customer, purchase, and invoice management, along with reporting and analytics." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            keyframes: {
              shimmer: {
                '100%': { transform: 'translateX(100%)' },
              },
              fadeIn: {
                'from': { opacity: '0' },
                'to': { opacity: '1' },
              },
              scaleIn: {
                'from': { opacity: '0', transform: 'scale(0.95)' },
                'to': { opacity: '1', transform: 'scale(1)' },
              }
            },
            animation: {
              shimmer: 'shimmer 1.5s infinite',
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'scale-in': 'scaleIn 0.2s ease-out forwards',
            }
          },
        },
      }
    </script>
  <style>
    @media (max-width: 767px) {
      .responsive-table thead {
        display: none;
      }
      .responsive-table tr {
        display: block;
        border-bottom: 2px solid #e2e8f0; /* border-slate-200 */
        margin-bottom: 1rem;
        padding-bottom: 1rem;
      }
      .responsive-table td {
        display: block;
        text-align: right;
        position: relative;
        padding-left: 50%;
        border-bottom: none;
      }
      .responsive-table td:last-child {
        padding-bottom: 0;
      }
      .responsive-table td::before {
        content: attr(data-label);
        position: absolute;
        left: 0.5rem;
        width: 45%;
        padding-right: 0.5rem;
        font-weight: 600;
        text-align: left;
        white-space: nowrap;
        color: #475569; /* text-slate-600 */
      }
      .responsive-table td .flex {
        justify-content: flex-end;
      }
    }
    @media print {
      body * {
        visibility: hidden;
      }
      .print-container, .print-container * {
        visibility: visible;
      }
      .print-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none;
      }
    }
  </style>
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-gray-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
